:root{color-scheme:light dark;
--bg:light-dark(#f4f5f8,#0b0c0f);--surface:light-dark(#ffffff,#17181d);--surface2:light-dark(#eef0f4,#202128);
--ink:light-dark(#0e1016,#eef0f6);--mute:light-dark(#646b7a,#9aa1b0);--line:light-dark(rgba(14,16,22,.09),rgba(255,255,255,.08));
--acc:light-dark(#3b5bfd,#6d86ff);--accSoft:light-dark(rgba(59,91,253,.1),rgba(109,134,255,.16));--hi:#ffd60a;--ok:light-dark(#0f8a5f,#4fd39b);--bad:#d92d3a;
--desk:light-dark(#e6e8ee,#060708);--glass:light-dark(rgba(255,255,255,.8),rgba(30,31,38,.76));
--sh:0 1px 2px rgba(10,14,30,.06),0 14px 34px -14px rgba(10,14,30,.28);--r:16px;
--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}

/* ---------- library ---------- */
#lib{min-height:100%;padding-bottom:120px}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) max(4vw,16px) 6px;max-width:1280px;margin:0 auto}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.mark img{width:30px;height:30px;border-radius:8px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;white-space:nowrap;flex:none;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--mute)}
.pill.ok{color:var(--ok)}
.pill.ok .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--surface2)}
.btnA{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 15px;border-radius:999px;border:0;background:var(--acc);color:#fff;font-weight:600;font-size:14px}
.head{max-width:1280px;margin:0 auto;padding:18px max(4vw,16px) 6px}
.head h1{margin:0;font-size:clamp(34px,5vw,46px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
.head p{margin:6px 0 0;color:var(--mute);font-size:15px}
.bar{max-width:1280px;margin:0 auto;padding:16px max(4vw,16px) 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--mute)}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;color:var(--ink);height:100%}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface2);gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;height:38px;padding:0 14px;border-radius:10px;border:0;background:none;font-weight:600;font-size:14px;color:var(--mute);transition:background .2s var(--ease),color .2s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sortb{height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
.remind{max-width:1280px;margin:14px auto 0;padding:0 max(4vw,16px)}
.remind>div{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--hi) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--hi) 55%,transparent)}
.remind b{font-weight:700}.remind span{flex:1 1 220px;font-size:15px}
.remind button{min-height:40px;padding:0 15px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px}
.grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:28px 20px;padding:22px max(4vw,16px)}
.card{position:relative;animation:rise .35s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card .open{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.thumb{position:relative;aspect-ratio:3/4;border-radius:12px;background:#fff;box-shadow:var(--sh);overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s}
.card .open:active .thumb{transform:scale(.97)}
@media(hover:hover){.card .open:hover .thumb{transform:translateY(-3px);box-shadow:0 2px 4px rgba(10,14,30,.08),0 22px 40px -16px rgba(10,14,30,.35)}}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cover{position:absolute;inset:0;padding:16px 14px 14px 24px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
 background:linear-gradient(150deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 70%,#000))}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.08) 70%,rgba(255,255,255,.12))}
.cover::after{content:"";position:absolute;right:16px;top:0;bottom:0;width:9px;background:rgba(0,0,0,.22);box-shadow:inset 1px 0 rgba(255,255,255,.15)}
.cover b{position:relative;font-size:16px;line-height:1.2;font-weight:700;letter-spacing:-.01em;padding-right:22px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cover small{position:relative;font-size:12px;opacity:.8;font-weight:600}
.kind{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(14,16,22,.72);color:#fff;letter-spacing:.02em}
.star{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#e5a400;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.star svg{width:15px;height:15px;fill:currentColor;stroke:none}
.meta{display:flex;align-items:flex-start;gap:4px;margin-top:11px}
.meta div{flex:1}
.meta b{display:block;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta span{font-size:13px;color:var(--mute)}
.meta .ib{margin:-8px -10px 0 0;color:var(--mute)}
.empty{grid-column:1/-1;display:grid;justify-items:center;text-align:center;padding:48px 16px;gap:6px}

.spark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#3b5bfd,#8b5cf6);color:#fff;flex:none}
.spark svg{width:17px;height:17px}
#aiBody{display:flex;flex-direction:column;flex:1;min-height:0}
.aictx{display:flex;align-items:center;gap:8px;margin:0 14px 10px;padding:8px;border-radius:14px;background:var(--surface2);font-size:13px;color:var(--mute);flex:none;flex-wrap:wrap}
.ctxs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.ctxs::-webkit-scrollbar{display:none}
.cx{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink)}
.cx img{width:44px!important;height:44px!important}
.cx .rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:12px;line-height:20px;padding:0;margin:0}
.cx.main img{outline:2px solid var(--acc);outline-offset:1px}
.ctxb{display:flex;gap:6px;flex:none}
.aictx img{width:46px;height:46px;object-fit:cover;object-position:top;border-radius:8px;background:#fff;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.aictx b{color:var(--ink);display:block;font-size:14px}
.ctxb button{flex:none;height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600}
.aiq{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto;scrollbar-width:none;flex:none}
.aiq::-webkit-scrollbar{display:none}
.aiq button{flex:none;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.aiq button:disabled{opacity:.4}
.msgs{flex:1;overflow:auto;padding:6px 14px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:94%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin-bottom:0}
.msg.a ul,.msg.a ol{margin:4px 0 8px;padding-left:20px}
.msg.a li{margin:2px 0}
.msg.a code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:.92em}
.msg .act .via{margin-left:auto;align-self:center;font-size:11px;font-weight:600;color:var(--mute)}
.msg .err{color:var(--bad);font-size:13px;margin-top:6px}
.msg .act{display:flex;gap:6px;margin-top:10px}
.msg .act button{height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:none;font-size:12px;font-weight:600;color:var(--mute)}
.think{display:inline-flex;gap:4px;padding:4px 0}.think i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
.aiin{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none}
.aiin textarea{flex:1;resize:none;min-height:46px;max-height:130px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:16px;line-height:1.35;outline:none;color:var(--ink)}
.aiin textarea:focus{border-color:var(--acc)}
.aiin button{width:46px;height:46px;border-radius:14px;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.aisetup{padding:4px 16px 16px;overflow:auto}
.aisetup p{color:var(--mute);font-size:14px;margin:0 0 12px}
.aisetup input{width:100%;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px;margin-bottom:10px;color:var(--ink)}
.aisetup a,.sheet a{color:var(--acc);font-weight:600}
@media(max-width:760px){.ai{left:8px;right:8px;width:auto;top:calc(68px + env(safe-area-inset-top));bottom:calc(8px + env(safe-area-inset-bottom))}}

/* ---------- sheets + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,10,18,.42);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);color:var(--ink);border-radius:22px;padding:22px;width:min(440px,100%);box-shadow:0 30px 80px -20px rgba(0,0,0,.55);animation:pop .28s var(--ease);max-height:calc(100% - 32px);overflow:auto}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
@media(max-width:600px){.scrim{place-items:end stretch;padding:0}.sheet{width:100%;border-radius:22px 22px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:up .3s var(--ease)}@keyframes up{from{transform:translateY(100%)}}}
.sheet h2{margin:0 0 4px;font-size:22px;line-height:1.2;letter-spacing:-.02em}
.sheet p{margin:0 0 14px;color:var(--mute);font-size:15px}
.sheet label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--mute)}
.sheet input[type=text]{width:100%;min-height:48px;font-size:16px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);outline:none}
.sheet input[type=text]:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:600;font-size:14px}
.opt[aria-pressed=true]{border-color:var(--acc);background:var(--accSoft);color:var(--acc)}
.covers{display:flex;gap:10px;flex-wrap:wrap}
.covers button{width:40px;height:52px;border-radius:6px;border:0;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c) 50%,color-mix(in srgb,var(--c) 70%,#000));box-shadow:inset 5px 0 rgba(0,0,0,.2)}
.covers button[aria-pressed=true]{outline:2.5px solid var(--acc);outline-offset:3px}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:22px}
.acts button{min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:none;font-weight:600}
.acts .go{background:var(--acc);border-color:var(--acc);color:#fff}
.acts .bad{background:var(--bad);border-color:var(--bad);color:#fff}
.list{display:grid;gap:2px;margin:8px -8px 0}
.list button{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 12px;border-radius:12px;border:0;background:none;text-align:left;font-weight:600;font-size:16px}
.list button:active{background:var(--surface2)}
.list button small{margin-left:auto;color:var(--mute);font-weight:500;font-size:14px}
.list button.bad{color:var(--bad)}
.list .sep{height:1px;background:var(--line);margin:6px 12px}
.tog{margin-left:auto;width:46px;height:28px;border-radius:999px;background:var(--surface2);position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.tog.on{background:var(--acc)}.tog.on::after{transform:translateX(18px)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#121420;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:0 14px 34px -10px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const r4=v=>Math.round(v*1e4)/1e4;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}};
const pdfjs=window.pdfjsLib;
if(pdfjs)pdfjs.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const COVERS=['#3b5bfd','#1d2433','#e4572e','#0f9d7a','#8b5cf6','#e8a33d'];
const PAPERS=[['lined','Lined'],['grid','Grid'],['dots','Dots'],['cornell','Cornell'],['blank','Blank']];
const folderSvg='<svg class="i" viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

/* ---------- toast + sheets ---------- */
let toastT;
function toast(msg,ms=2400){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}
function sheet(html,wire){
 return new Promise(res=>{
  const m=$('#modal');m.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  let done=false;const close=v=>{if(done)return;done=true;m.innerHTML='';res(v)};
  m.querySelector('.scrim').addEventListener('click',e=>{if(e.target.classList.contains('scrim'))close(null)});
  m.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>close(b.dataset.v)));
  m.querySelector('form')?.addEventListener('submit',e=>{e.preventDefault();close('ok')});
  wire&&wire(m,close);
  const inp=m.querySelector('input[type=text]');if(inp)setTimeout(()=>{inp.focus();inp.select()},60);
 });
}
const pick=(m,sel,attr,cb)=>{m.querySelectorAll(sel).forEach(b=>b.addEventListener('click',()=>{m.querySelectorAll(sel).forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.getAttribute(attr))}))};

/* ---------- storage on this device (IndexedDB) ---------- */
const store=(()=>{
 let db=null;const mem={docs:new Map(),pdfs:new Map(),blobs:new Map()};
 const ready=new Promise(res=>{
  try{const r=indexedDB.open('margins',3);
   r.onupgradeneeded=()=>{const d=r.result;for(const n of['docs','pdfs','blobs'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta')){const ms=d.createObjectStore('meta',{keyPath:'id'});
     // one-time: make a small summary of every note so the library opens fast
     const c=r.transaction.objectStore('docs').openCursor();c.onsuccess=()=>{const cur=c.result;if(!cur)return;ms.put(metaOf(cur.value));cur.continue()}}};
   r.onsuccess=()=>{db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false);
  }catch(e){res(false)}
 });
 function metaOf(d){const m={};for(const k in d)if(k!=='pages')m[k]=d[k];m.pages={length:(d.pages||[]).length};m.meta=1;return m}
 const tx=(s,mode,f)=>new Promise((res,rej)=>{const t=db.transaction(s,mode);const q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
 return{ready,get ok(){return !!db},
  all:()=>db?tx('docs','readonly',s=>s.getAll()):Promise.resolve([...mem.docs.values()]),
  /* light list for the library: names, covers, folders, page counts. No ink. */
  meta:()=>db?tx('meta','readonly',s=>s.getAll()):Promise.resolve([...mem.docs.values()].map(metaOf)),
  get:id=>db?tx('docs','readonly',s=>s.get(id)):Promise.resolve(mem.docs.get(id)),
  put:d=>(d&&d.meta)?Promise.reject(new Error('summary, not a note')):db?new Promise((res,rej)=>{const t=db.transaction(['docs','meta'],'readwrite');t.objectStore('docs').put(d);t.objectStore('meta').put(metaOf(d));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}):(mem.docs.set(d.id,d),Promise.resolve()),
  async del(id){if(!db){mem.docs.delete(id);mem.pdfs.delete(id);return}await new Promise((res,rej)=>{const t=db.transaction(['docs','meta','pdfs'],'readwrite');for(const n of['docs','meta','pdfs'])t.objectStore(n).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  putPdf:(id,bytes)=>db?tx('pdfs','readwrite',s=>s.put({id,bytes})):(mem.pdfs.set(id,bytes),Promise.resolve()),
  async getPdf(id){if(!db)return mem.pdfs.get(id)||null;const r=await tx('pdfs','readonly',s=>s.get(id));return r?r.bytes:null},
  putBlob:(id,data)=>db?tx('blobs','readwrite',s=>s.put({id,data})):(mem.blobs.set(id,data),Promise.resolve()),
  async getBlob(id){if(!db)return mem.blobs.get(id)||null;const r=await tx('blobs','readonly',s=>s.get(id));return r?r.data:null},
  delBlob:id=>db?tx('blobs','readwrite',s=>s.delete(id)):(mem.blobs.delete(id),Promise.resolve())
 };
})();
let persisted=null;
async function checkPersist(ask){
 try{if(!navigator.storage||!navigator.storage.persisted){persisted=null;return}
  persisted=await navigator.storage.persisted();
  if(!persisted&&ask)persisted=await navigator.storage.persist();
 }catch(e){persisted=null}
 paintPill();
}
function paintPill(){
 const p=$('#stPill');
 if(!store.ok){p.className='pill';p.style.color='var(--bad)';p.textContent='Storage blocked';return}
 p.style.color='';
 if(persisted){p.className='pill ok';p.innerHTML='<span class="dot"></span>Protected'}
 else{p.className='pill';p.innerHTML='<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/></svg>Protect storage'}
}
$('#stPill').onclick=async()=>{
 await checkPersist(true);
 if(persisted){toast('Storage is protected. Android won\'t clear it to free up space.',3200);return}
 sheet(`<h2>Protect your notes</h2><p>${store.ok?'Your files are saved on this tablet. Chrome hasn\'t locked the storage yet, so if your tablet runs very low on space it could clear it.':'This browser view is blocking storage, so nothing will be kept.'}</p>
  <p><b style="color:var(--ink)">To lock it in:</b> install Margins (Chrome menu ⋮ then <i>Add to Home screen</i> or <i>Install app</i>), open it from the home screen and use it a bit. Chrome usually protects installed apps automatically.</p>
  <p>Backups are your safety net either way. One file holds everything.</p>
  <div class="acts"><button data-v="x">Later</button><button data-v="b" class="go">Back up now</button></div>`).then(v=>{if(v==='b')backup()});
};

async function saveFile(name,blob){
 if(dl){try{await dl.save({filename:name,data:blob});toast('Saved '+name);return true}catch(e){if(e&&e.code==='declined')return false;toast('Could not save: '+((e&&e.message)||'not available'));return false}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);toast('Saved to Downloads: '+name,3000);return true}
 catch(e){toast('Downloads are not available here');return false}
}

/* ---------- paper ---------- */
const A4=1.4142;
function drawPaper(ctx,w,h,bg){
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
 if(bg==='lined'){ctx.strokeStyle='#cbd7ec';ctx.lineWidth=Math.max(1,w/900);const g=w*.038;for(let y=w*.14;y<h-g*.5;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  ctx.strokeStyle='#f2b8b8';ctx.beginPath();ctx.moveTo(w*.1,0);ctx.lineTo(w*.1,h);ctx.stroke()}
 else if(bg==='grid'){ctx.strokeStyle='#e0e5ee';ctx.lineWidth=Math.max(1,w/1000);const g=w*.035;for(let x=g;x<w;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=g;y<h;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
 else if(bg==='dots'){ctx.fillStyle='#c4cad6';const g=w*.035,r=Math.max(1,w/600);for(let x=g;x<w;x+=g)for(let y=g;y<h;y+=g){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}}
 else if(bg==='cornell'){ctx.strokeStyle='#d5deee';ctx.lineWidth=Math.max(1,w/900);const g=w*.038,sy=h*.8;for(let y=w*.14;y<sy-g*.3;y+=g){ctx.beginPath();ctx.moveTo(w*.3,y);ctx.lineTo(w,y);ctx.stroke()}
  ctx.strokeStyle='#9fb0cf';ctx.lineWidth=Math.max(1.5,w/500);ctx.beginPath();ctx.moveTo(0,w*.1);ctx.lineTo(w,w*.1);ctx.moveTo(w*.3,w*.1);ctx.lineTo(w*.3,sy);ctx.moveTo(0,sy);ctx.lineTo(w,sy);ctx.stroke()}
}

/* ---------- folders ---------- */
const FCOL=['#3b5bfd','#e4572e','#0f9d7a','#8b5cf6','#e8a33d','#ec4899','#1d2433'];
function storedFolders(){try{const a=JSON.parse(ls.get('m.folders')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveFolders(a){ls.set('m.folders',JSON.stringify(a))}
function allFolders(docs){const st=storedFolders(),names=new Set(st.map(f=>f.name));let k=st.length;for(const d of docs)if(d.folder&&!names.has(d.folder)){st.push({name:d.folder,color:FCOL[k++%FCOL.length]});names.add(d.folder)}return st.sort((a,b)=>a.name.localeCompare(b.name))}
const foldSvg=c=>`<svg class="fold" viewBox="0 0 46 38" aria-hidden="true"><path d="M2 7a4 4 0 0 1 4-4h11l4 4h19a4 4 0 0 1 4 4v3H2z" fill="${c}" opacity=".55"/><rect x="2" y="11" width="42" height="25" rx="4" fill="${c}"/><rect x="2" y="11" width="42" height="7" rx="4" fill="#fff" opacity=".14"/></svg>`;
async function folderSheet(f){
 const editing=!!f;let name=f?f.name:'',color=f?f.color:FCOL[storedFolders().length%FCOL.length];
 const r=await sheet(`<form><h2>${editing?'Edit folder':'New folder'}</h2><label for="fn">Name</label><input type="text" id="fn" value="${esc(name)}" placeholder="e.g. Biology" maxlength="40">
  <label>Colour</label><div class="opts">${FCOL.map(c=>`<button type="button" class="opt" data-fc="${c}" aria-pressed="${c===color}" aria-label="Colour ${c}" style="width:44px;padding:0;display:grid;place-items:center"><span style="width:22px;height:22px;border-radius:7px;background:${c}"></span></button>`).join('')}</div>
  <div class="acts">${editing?'<button type="button" data-v="del" class="bad">Delete folder</button>':''}<button type="button" data-v="x">Cancel</button><button class="go">${editing?'Save':'Create'}</button></div></form>`,
  m=>{m.querySelector('#fn').addEventListener('input',e=>name=e.target.value);pick(m,'[data-fc]','data-fc',v=>color=v)});
 const all=await store.meta();let st=allFolders(all);
 if(r==='del'){
  const n=all.filter(d=>d.folder===f.name);
  const ok=await sheet(`<h2>Delete "${esc(f.name)}"?</h2><p>${n.length?`Its ${n.length} ${n.length===1?'file goes':'files go'} back to the main library. Nothing is deleted.`:'It is empty.'}</p><div class="acts"><button data-v="x">Cancel</button><button data-v="yes" class="bad">Delete folder</button></div>`);
  if(ok!=='yes')return;
  for(const m of n){const d=await store.get(m.id);if(!d)continue;delete d.folder;d.dirty=true;await store.put(d)}
  saveFolders(st.filter(x=>x.name!==f.name));if(L.folder===f.name)L.folder='';ls.set('m.folder',L.folder);showLib();syncAll();toast('Folder deleted');return;
 }
 if(r!=='ok')return;name=name.trim();if(!name)return toast('Give the folder a name');
 if(st.some(x=>x.name.toLowerCase()===name.toLowerCase()&&(!f||x.name!==f.name)))return toast('A folder with that name already exists');
 if(editing){
  for(const m of all.filter(d=>d.folder===f.name)){const d=await store.get(m.id);if(!d)continue;d.folder=name;d.dirty=true;await store.put(d)}
  st=st.map(x=>x.name===f.name?{name,color}:x);if(L.folder===f.name){L.folder=name;ls.set('m.folder',name)}
 }else st.push({name,color});
 saveFolders(st);showLib();if(editing)syncAll();toast(editing?'Folder updated':'Folder created');
}
$('#newFolder').onclick=()=>folderSheet(null);
$('#ftiles').addEventListener('click',e=>{const t=e.target.closest('.ftile');if(!t)return;if(t.classList.contains('new'))return folderSheet(null);L.folder=t.dataset.fd;ls.set('m.folder',L.folder);$('#q').value='';L.q='';showLib();scrollTo({top:0})});

/* ---------- library ---------- */
const L={f:ls.get('m.filter')||'all',sort:ls.get('m.sort')||'recent',q:'',folder:ls.get('m.folder')||''};
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';if(s<172800)return'yesterday';return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'})}
const starSvg='<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';
async function showLib(){
 $('#reader').classList.add('hidden');$('#lib').classList.remove('hidden');
 await store.ready;paintPill();
 const all=await store.meta();
 const FL=allFolders(all);
 if(L.folder&&!FL.some(f=>f.name===L.folder))L.folder='';
 const inF=FL.find(f=>f.name===L.folder),h=new Date().getHours();
 $('#head').innerHTML=inF
  ?`<button class="crumb" id="crumb"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Library</button><div class="headrow"><h1>${esc(inF.name)}</h1><button class="ib" id="fEdit" aria-label="Edit folder"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button></div><p id="sub"></p>`
  :`<span class="hello">${h<5?'Up late':h<12?'Good morning':h<18?'Good afternoon':'Good evening'}</span><h1>Library</h1><p id="sub"></p>`;
 $('#fsec').classList.toggle('hidden',!!inF);
 $('#slabel').classList.toggle('hidden',!!inF);
 $('#ftiles').innerHTML=FL.map(f=>{const n=all.filter(d=>d.folder===f.name).length;return `<button class="ftile" data-fd="${esc(f.name)}">${foldSvg(f.color)}<b>${esc(f.name)}</b><span>${n} ${n===1?'file':'files'}</span></button>`}).join('')
  +`<button class="ftile new" aria-label="New folder"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New folder</button>`;
 $('#slabel h2').textContent=L.f==='star'?'Starred':L.f==='pdf'?'PDFs':L.f==='nb'?'Notebooks':FL.length?'All files':'Your files';
 let docs=all.filter(d=>(!L.folder||d.folder===L.folder)&&(L.f==='all'||(L.f==='pdf'&&d.hasPdf)||(L.f==='nb'&&!d.hasPdf)||(L.f==='star'&&d.star))&&(!L.q||d.name.toLowerCase().includes(L.q)));
 docs.sort(L.sort==='name'?(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}):(a,b)=>b.updated-a.updated);
 const nP=all.filter(d=>d.hasPdf).length;
 if(inF){const n=all.filter(d=>d.folder===inF.name).length;$('#sub').textContent=n?`${n} ${n===1?'file':'files'} · tap + to add straight into this folder`:'Empty folder. Tap + to add a PDF or notebook here.'}
 else $('#sub').textContent=all.length?`${nP} ${nP===1?'PDF':'PDFs'} · ${all.length-nP} ${all.length-nP===1?'notebook':'notebooks'} · all on this device`:'Write on PDFs. Fill notebooks. No limits.';
 $$('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===L.f));
 $('#sortB').innerHTML=`<svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg>${L.sort==='name'?'A–Z':'Recent'}`;
 const last=+ls.get('m.lastBackup')||0,first=Math.min(...all.map(d=>d.created),Date.now());
 const need=store.ok&&!SY.dir&&all.length&&(last?Date.now()-last>7*864e5:Date.now()-first>2*864e5);
 $('#remind').classList.toggle('hidden',!need);
 if(need)$('#remind').innerHTML=`<div><svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><span><b>Time for a backup.</b> ${last?'Last one was '+ago(last)+'.':'You haven\'t made one yet.'} Or switch on auto-save and never think about it again.</span><button id="rA" style="background:var(--acc);color:#fff">Set up auto-save</button><button id="rB">Back up now</button></div>`;
 $('#grid').innerHTML=docs.length?docs.map((d,k)=>`<article class="card" style="animation-delay:${Math.min(k,12)*25}ms">
   <button class="open" data-id="${d.id}" aria-label="Open ${esc(d.name)}"><div class="thumb">${d.hasPdf
     ?(d.thumb?`<img src="${d.thumb}" alt="">`:'')+'<span class="kind">PDF</span>'
     :`<div class="cover" style="--c:${d.cover||COVERS[0]}"><b>${esc(d.name)}</b><small>${d.pages.length} ${d.pages.length===1?'page':'pages'}</small></div>`}
     ${d.star?`<span class="star">${starSvg}</span>`:''}</div></button>
   <div class="meta"><div><b>${esc(d.name)}</b><span>${ago(d.updated)}${d.hasPdf?' · '+d.pages.length+(d.pages.length===1?' page':' pages'):''}</span></div>
   <button class="ib more" data-id="${d.id}" aria-label="Options for ${esc(d.name)}"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button></div>
  </article>`).join('')
  :(inF&&!L.q?`<div class="empty"><strong>Nothing in ${esc(inF.name)} yet</strong><p>Tap + to open a PDF or start a notebook right here, or move files in from their ⋯ menu.</p></div>`
  :all.length?`<div class="empty"><strong>No matches</strong><p>Nothing here for this search or filter.</p></div>`
  :`<div class="empty"><svg class="art" viewBox="0 0 200 150" aria-hidden="true"><rect x="58" y="18" width="84" height="112" rx="6" fill="#fff" stroke="rgba(0,0,0,.08)"/><rect x="44" y="26" width="84" height="112" rx="6" fill="#fff" stroke="rgba(0,0,0,.1)" transform="rotate(-6 86 82)"/><rect x="58" y="44" width="56" height="10" rx="4" fill="#ffd60a" opacity=".85"/><rect x="62" y="47" width="48" height="4" rx="2" fill="#1d2433"/><rect x="62" y="66" width="62" height="4" rx="2" fill="#d5dae5"/><rect x="62" y="80" width="54" height="4" rx="2" fill="#d5dae5"/><path d="M64 104q8-10 16 0t16 0 16 0" fill="none" stroke="#3b5bfd" stroke-width="3.5" stroke-linecap="round"/><path d="M150 64l18-18 8 8-18 18-11 3z" fill="#3b5bfd"/></svg>
   <strong>Your library is empty</strong><p>Open a PDF to mark it up, or start a notebook. Keep as many as you want.</p>
   <div class="row"><button class="btnP" id="eOpen"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 15V3m0 0L7 8m5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Open a PDF</button><button class="btnG" id="eNew">New notebook</button></div></div>`);
}

function docRefs(d){const s=new Set();for(const p of d.pages)for(const it of p.a)if(it.t==='img')s.add(it.ref);for(const a of d.audio||[])s.add(a.id);return s}
async function deleteDoc(d){if(d.filePath&&SY.dir&&await ensurePerm(false))await removePath(d.filePath);const keep=new Set();for(const o of await store.all())if(o.id!==d.id)docRefs(o).forEach(r=>keep.add(r));for(const r of docRefs(d))if(!keep.has(r))await store.delBlob(r);await store.del(d.id)}
async function docMenu(id){
 const d=await store.get(id);if(!d)return;
 const v=await sheet(`<h2>${esc(d.name)}</h2><p>${d.hasPdf?'PDF':'Notebook'} · ${d.pages.length} pages · edited ${ago(d.updated)}</p>
  <div class="list">
   <button data-v="star"><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>${d.star?'Remove star':'Star'}</button>
   <button data-v="ren"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11a2.1 2.1 0 0 0-3-3L5 16l-1 4z"/></svg>Rename</button>

   const sc=w.h>1e-4?clamp(1+(hm/w.h-1)*.35,.85,1.18):1,dy=(py-w.cy)*.75;
   for(const s of w.s){const p=s.p.slice();for(let j=0;j<p.length;j+=2){p[j]=w.cx+(p[j]-w.cx)*sc+shift;p[j+1]=w.cy+(p[j+1]-w.cy)*sc+dy}plan.set(s.it,p)}
  });
 }
 // smooth shaky strokes a little
 for(const [it,p] of plan){const n=p.length/2;if(n<5)continue;for(let pass=0;pass<2;pass++){const q=p.slice();for(let j=1;j<n-1;j++){q[2*j]=.25*p[2*j-2]+.5*p[2*j]+.25*p[2*j+2];q[2*j+1]=.25*p[2*j-1]+.5*p[2*j+1]+.25*p[2*j+3]}for(let j=0;j<p.length;j++)p[j]=q[j]}}

 else items=page.a.filter(it=>{
  if(it.t==='text'){const b=bbox.get(it);return !!b&&inPoly(b.x+b.w/2,b.y+b.h/2,poly)}
  if(it.t==='img')return inPoly(it.x+it.w/2,it.y+it.h/2,poly);
  const p=it.p,n=p.length/2,st=Math.max(1,Math.floor(n/24));let a=0,k=0;for(let j=0;j<n;j+=st){k++;if(inPoly(p[2*j],p[2*j+1],poly))a++}return a/k>=.5;

function laserTick(){

async function pageCanvas(k,w){
 const p=S.doc.pages[k],h=Math.round(w*p.r),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 if(p.s!=null&&S.pdf)x.drawImage(await renderPdfPage(p.s,w,h),0,0);else drawPaper(x,w,h,p.bg);
 await Promise.all(p.a.filter(it=>it.t==='img').map(it=>ensureImg(it.ref)));
 x.globalCompositeOperation='multiply';drawItems(x,p.a,w);x.globalCompositeOperation='source-over';return c;
}
async function savePageImage(k){toast('Rendering page…',30000);const c=await pageCanvas(k,1600);c.toBlob(b=>{if(b)saveFile(`${S.doc.name} page ${k+1}.png`,b)},'image/png')}
async function delPage(k){
 const d=S.doc;if(d.pages.length<=1)return toast('A file needs at least one page');
 const r=await sheet(`<h2>Delete page ${k+1}?</h2><p>${d.pages[k].s!=null?'The page is hidden in Margins and your notes on it are removed. Your original PDF isn\'t touched.':'The page and everything on it is removed.'}</p><div class="acts"><button data-v="x">Cancel</button><button data-v="yes" class="bad">Delete page</button></div>`);
 if(r!=='yes')return;
 d.pages.splice(k,1);structural();
}

/* find in document */
async function pageText(k){
 const p=S.doc.pages[k];let t='';
 if(p.s!=null&&S.pdf){if(S.txt[p.s]==null){try{const tc=await(await S.pdf.getPage(p.s+1)).getTextContent();S.txt[p.s]=tc.items.map(x=>x.str+(x.hasEOL?'\n':'')).join(' ').replace(/[ \t]+/g,' ')}catch(e){S.txt[p.s]=''}}t=S.txt[p.s]}
 if(p.ocr)t+='\n'+p.ocr;
 for(const it of p.a)if(it.t==='text')t+='\n'+it.v;
 return t;
}
function findSheet(){
 sheet(`<h2>Find</h2><label class="search" style="margin-top:12px"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="fq" type="search" placeholder="Search words in this file" aria-label="Search words"></label><div class="res" id="fres"></div>`,(m,close)=>{
  const inp=m.querySelector('#fq'),out=m.querySelector('#fres');setTimeout(()=>inp.focus(),80);let tk=0,T;
  inp.addEventListener('input',()=>{clearTimeout(T);T=setTimeout(async()=>{
   const q=inp.value.trim().toLowerCase(),my=++tk;if(q.length<2){out.innerHTML='';return}
   out.innerHTML='<p style="padding:0 12px">Searching…</p>';const res=[];
   for(let k=0;k<S.doc.pages.length&&res.length<60;k++){const t=await pageText(k);if(my!==tk)return;const lo=t.toLowerCase();let at=lo.indexOf(q),c=0;
    while(at>=0&&c<3&&res.length<60){const a=Math.max(0,at-40),b=Math.min(t.length,at+q.length+70);res.push({k,html:(a?'…':'')+esc(t.slice(a,at))+'<mark>'+esc(t.slice(at,at+q.length))+'</mark>'+esc(t.slice(at+q.length,b))+(b<t.length?'…':'')});at=lo.indexOf(q,at+q.length);c++}}
   out.innerHTML=res.length?res.map(r=>`<button data-k="${r.k}"><b>Page ${r.k+1}</b>${r.html}</button>`).join(''):'<p style="padding:0 12px">No matches. If this is a scanned PDF or handwriting, open Pages, tap the list button, then Scan pages with AI. After that, search finds it.</p>';
  },220)});
  out.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b){close(null);jumpTo(+b.dataset.k)}});
 });
}

/* audio */
const R={mr:null,chunks:[],t0:0,iv:0,doc:null};
const fmtDur=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
async function startRec(){
 if(R.mr)return;
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);
  R.mr=mr;R.chunks=[];R.t0=Date.now();R.doc=S.doc;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)R.chunks.push(e.data)};
  mr.onstop=async()=>{
   st.getTracks().forEach(t=>t.stop());clearInterval(R.iv);$('#rec').classList.add('hidden');
   const blob=new Blob(R.chunks,{type:mr.mimeType||'audio/webm'}),dur=Math.round((Date.now()-R.t0)/1000),d=R.doc;R.mr=null;R.doc=null;if(!d||!blob.size)return;
   const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
   const id=uid();await store.putBlob(id,data);d.audio=d.audio||[];d.audio.push({id,name:'Recording '+(d.audio.length+1),dur,created:Date.now()});d.updated=Date.now();await store.put(d);
   toast('Recording saved. Play it from More, then Recordings.',3200);
  };
  mr.start(1000);$('#rec').classList.remove('hidden');$('#recT').textContent='0:00';
  R.iv=setInterval(()=>{$('#recT').textContent=fmtDur(Math.round((Date.now()-R.t0)/1000))},500);buzz();
 }catch(e){toast('Microphone not available here. It works in the installed app.',3600)}
}
$('#recStop').onclick=()=>{if(R.mr)R.mr.stop()};
async function recSheet(){
 const d=S.doc,list=d.audio||[];if(!list.length)return toast('No recordings yet');
 const rows=await Promise.all(list.map(async a=>{const src=await store.getBlob(a.id);return `<div class="audioRow"><div><b>${esc(a.name)}</b><span style="font-size:12px;color:var(--mute)">${fmtDur(a.dur)} · ${ago(a.created)}</span><audio controls preload="metadata" src="${src||''}"></audio></div><button class="ib" data-del="${a.id}" aria-label="Delete ${esc(a.name)}">${ic('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>')}</button></div>`}));
 sheet(`<h2>Recordings</h2>${rows.join('')}<div class="acts"><button data-v="x">Done</button></div>`,m=>{
  m.addEventListener('click',async e=>{const b=e.target.closest('[data-del]');if(!b)return;d.audio=d.audio.filter(a=>a.id!==b.dataset.del);await store.delBlob(b.dataset.del);await flush();b.closest('.audioRow').remove();toast('Recording deleted',1200)});
 });
}

/* pages panel */
const thumbDirty=new Set();
const tio=new IntersectionObserver(ents=>{for(const en of ents)if(en.isIntersecting){tio.unobserve(en.target);renderThumb(+en.target.dataset.i,en.target.querySelector('canvas'))}},{root:$('#thumbs'),rootMargin:'300px'});
function buildThumbs(){
 if($('#panel').classList.contains('hidden'))return;
 tio.disconnect();
 $$('#ptabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pt===(S.ptab||'all')));
 const idx=S.doc.pages.map((p,i)=>i).filter(i=>S.ptab!=='bm'||S.doc.pages[i].bm);
 const th=i=>{const p=S.doc.pages[i];return `<button class="th" data-i="${i}"><canvas style="aspect-ratio:1/${p.r}"></canvas>${p.bm?'<span class="bm"></span>':''}${i+1}</button>`};
 const heads=[];S.doc.pages.forEach((p,i)=>(p.heads||[]).forEach((h,j)=>heads.push(Object.assign({i,j},h))));
 let html='';
 if(S.ptab==='bm'||!heads.length)html=idx.map(th).join('');
 else{
  const n=S.doc.pages.length;if(heads[0].i>0)for(let i=0;i<heads[0].i;i++)html+=th(i);
  heads.forEach((h,k)=>{const nx=k+1<heads.length?heads[k+1].i:n,end=nx>h.i?nx-1:h.i,lv=Math.min(3,(String(h.n).match(/\./g)||[]).length);
   html+=`<div class="sech lv${lv}" data-go="${h.i}"><span class="sn">${esc(h.n||'•')}</span><span class="st">${esc(h.t||'Section')}</span><small>${end-h.i+1} p</small><button class="secm" data-hp="${h.i}" data-hj="${h.j}" aria-label="Edit section">${ic('<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>')}</button></div>`;
   for(let i=h.i;i<=end;i++)html+=th(i)});
 }
 $('#thumbs').innerHTML=html||'<p style="grid-column:1/-1;color:var(--mute);font-size:14px;margin:8px 2px">No bookmarks yet. Long-press a page, or use More, then Bookmark.</p>';
 $$('#thumbs .th').forEach(t=>tio.observe(t));curPage();
}

}).catch(()=>{})}

async function enterRead(){

function hexRgb(h){const n=parseInt(h.slice(1),16);return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)}
async function exportPdf(d){
 if(!window.PDFLib)return toast('PDF writer failed to load. Reload the app.');

async function buildPdfBytes(d){
 {
  const{PDFDocument,rgb,LineCapStyle,BlendMode,StandardFonts}=PDFLib;
  const out=await PDFDocument.create();let copied=[];
  if(d.hasPdf){const b=await store.getPdf(d.id);const src=await PDFDocument.load(b,{ignoreEncryption:true});copied=await out.copyPages(src,src.getPageIndices())}
  const font=await out.embedFont(StandardFonts.Helvetica);const emb=new Map();
  const baseW=copied[0]?copied[0].getSize().width:595.28;
  for(const p of d.pages){
   let pg;
   if(p.s!=null&&copied[p.s]){pg=copied[p.s];out.addPage(pg)}else{pg=out.addPage([baseW,baseW*p.r]);paperPdf(pg,p.bg,rgb)}
   const{width:W,height:H}=pg.getSize();
   for(const it of p.a){
    if(it.t==='img'){try{let im=emb.get(it.ref);if(!im){const src=await store.getBlob(it.ref);if(!src)continue;const bytes=fromB64(src.split(',')[1]);im=src.startsWith('data:image/png')?await out.embedPng(bytes):await out.embedJpg(bytes);emb.set(it.ref,im)}
     pg.drawImage(im,{x:it.x*W,y:H-(it.y+it.h)*W,width:it.w*W,height:it.h*W})}catch(e){}continue}
    if(it.t==='text'){const fs=it.z*W;it.v.split('\n').forEach((ln,k)=>{const safe=ln.replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');if(safe)pg.drawText(safe,{x:it.x*W,y:H-it.y*W-fs*(k*1.25+.9),size:fs,font,color:hexRgb(it.c)})});continue}
    const kk=kindOf(it);
    if(isBlob(kk)){const f=v=>v.toFixed(2);let dd='';
     blob({c(x,y,r){dd+=`M${f(x+r)} ${f(y)}A${f(r)} ${f(r)} 0 1 1 ${f(x-r)} ${f(y)}A${f(r)} ${f(r)} 0 1 1 ${f(x+r)} ${f(y)}Z`},q(pts){dd+='M'+pts.map(a=>f(a[0])+' '+f(a[1])).join('L')+'Z'}},it.p,widths(it),W);
     pg.drawSvgPath(dd,{x:0,y:H,color:hexRgb(it.c),opacity:kk==='pencil'?.75:1});continue}
    const q=it.p;let path='';for(let k=0;k<q.length;k+=2)path+=(k?'L':'M')+(q[k]*W).toFixed(2)+' '+(q[k+1]*W).toFixed(2)+' ';
    if(q.length<=2)path+='L'+(q[0]*W+.2).toFixed(2)+' '+(q[1]*W).toFixed(2);
    const o={x:0,y:H,borderColor:hexRgb(it.c),borderWidth:it.w*W,borderLineCap:LineCapStyle.Round};
    if(it.t==='hl'){o.borderOpacity=.42;o.blendMode=BlendMode.Multiply}
    pg.drawSvgPath(path,o);
   }
  }
  return await out.save();
 }
}
function paperPdf(pg,bg,rgb){
 const{width:w,height:h}=pg.getSize();
 if(bg==='lined'){const g=w*.038;for(let y=w*.14;y<h-g*.5;y+=g)pg.drawLine({start:{x:0,y:h-y},end:{x:w,y:h-y},thickness:.5,color:rgb(.8,.84,.92)});pg.drawLine({start:{x:w*.1,y:0},end:{x:w*.1,y:h},thickness:.5,color:rgb(.95,.72,.72)})}
 else if(bg==='grid'){const g=w*.035;for(let x=g;x<w;x+=g)pg.drawLine({start:{x,y:0},end:{x,y:h},thickness:.4,color:rgb(.88,.9,.93)});for(let y=g;y<h;y+=g)pg.drawLine({start:{x:0,y:h-y},end:{x:w,y:h-y},thickness:.4,color:rgb(.88,.9,.93)})}
 else if(bg==='dots'){const g=w*.035;for(let x=g;x<w;x+=g)for(let y=g;y<h;y+=g)pg.drawCircle({x,y:h-y,size:.6,color:rgb(.77,.79,.84)})}
 else if(bg==='cornell'){const g=w*.038,sy=h*.8,c1=rgb(.84,.87,.93),c2=rgb(.62,.69,.81);for(let y=w*.14;y<sy-g*.3;y+=g)pg.drawLine({start:{x:w*.3,y:h-y},end:{x:w,y:h-y},thickness:.5,color:c1});
  pg.drawLine({start:{x:0,y:h-w*.1},end:{x:w,y:h-w*.1},thickness:1,color:c2});pg.drawLine({start:{x:w*.3,y:h-w*.1},end:{x:w*.3,y:h-sy},thickness:1,color:c2});pg.drawLine({start:{x:0,y:h-sy},end:{x:w,y:h-sy},thickness:1,color:c2})}
}

/* ---------- sections (1.1, 1.2 …) ---------- */
const HEAD_RE=/^(?:(chapter|unit|topic|topik|subtopik|bab|section|lesson|part|module|modul)\s+)?(\d{1,2}(?:\.\d{1,2}){0,3})\.?\s*[:.\-–]?\s+([A-Za-z(À-ɏ].{1,80})$/i;
async function detectSections(){
 const d=S.doc,pdf=S.pdf;if(!d||!pdf)return 0;let found=0;
 for(let k=0;k<d.pages.length;k++){
  if(S.doc!==d)return found;const p=d.pages[k];if(p.s==null)continue;
  let tc;try{tc=await(await pdf.getPage(p.s+1)).getTextContent()}catch(e){continue}
  const items=tc.items.filter(x=>x.str&&x.str.trim());if(!items.length)continue;
  const body=med(items.map(x=>Math.hypot(x.transform[2],x.transform[3])));
  const rows=[];for(const x of items){const y=x.transform[5],h=Math.hypot(x.transform[2],x.transform[3]);let r=rows.find(r=>Math.abs(r.y-y)<=Math.max(2,h*.3));if(!r){r={y,h:0,parts:[]};rows.push(r)}r.parts.push(x);r.h=Math.max(r.h,h)}
  rows.sort((a,b)=>b.y-a.y);
  const heads=[];
  for(const r of rows){const txt=r.parts.sort((a,b)=>a.transform[4]-b.transform[4]).map(x=>x.str).join(' ').replace(/\s+/g,' ').trim();if(txt.length>95)continue;
   const m=txt.match(HEAD_RE);if(!m)continue;
   const num=m[2],dotted=num.includes('.'),word=!!m[1],big=r.h>=body*1.15;
   if(!(dotted||word||big))continue;if(!dotted&&!word&&+num>40)continue;
   let title=m[3].replace(/\s*\.{3,}.*$/,'').replace(/\s+\d+$/,'').trim();if(title.length<2)continue;
   heads.push({n:(word?m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+' ':'')+num,t:title,auto:'pdf'});
  }
  if(heads.length>6)continue; // a contents page, not real section starts
  const keep=(p.heads||[]).filter(h=>h.auto!=='pdf');p.heads=keep.concat(heads);if(!p.heads.length)delete p.heads;found+=heads.length;
 }
 return found;
}

/* ---------- quick scan: Tesseract OCR on the tablet itself ---------- */
const LO={stop:false,busy:false,w:null,idle:0};
function loadTess(){
 if(window.Tesseract)return Promise.resolve();
 if(!loadTess.p)loadTess.p=new Promise((ok,bad)=>{const sc=document.createElement('script');sc.src='tesseract.min.js';sc.onload=ok;sc.onerror=()=>{loadTess.p=null;bad({code:'tessfile'})};document.head.appendChild(sc)});
 return loadTess.p;
}
async function tessWorker(){
 clearTimeout(LO.idle);if(LO.w)return LO.w;await loadTess();
 const u=f=>new URL(f,location.href).href;
 LO.w=await Tesseract.createWorker('eng',1,{workerPath:u('tesseract-worker.min.js'),corePath:u('tesseract-core.wasm.js'),langPath:u('./').replace(/\/$/,''),gzip:true,workerBlobURL:false});
 return LO.w;
}
function tessSleep(){clearTimeout(LO.idle);LO.idle=setTimeout(()=>{if(LO.w&&!LO.busy){LO.w.terminate().catch(()=>{});LO.w=null}},60000)}
async function needsOCR(k,force){
 const p=S.doc.pages[k];if(p.ocr&&!force)return false;if(p.ocrTry&&!force)return false;
 if(p.s!=null&&S.pdf){await pageText(k);return (S.txt[p.s]||'').replace(/\s/g,'').length<25}
 return p.a.some(it=>it.t==='img');
}
function ocrHeads(lines){
 const hs=lines.map(l=>l.bbox.y1-l.bbox.y0).filter(h=>h>0),body=med(hs)||1,out=[];
 for(const l of lines){
  const txt=l.text.replace(/\s+/g,' ').trim();if(txt.length>95||l.confidence<55)continue;
  const m=txt.match(HEAD_RE);if(!m)continue;
  const num=m[2],dotted=num.includes('.'),word=!!m[1],big=(l.bbox.y1-l.bbox.y0)>=body*1.2;
  if(!(dotted||word||big))continue;if(!dotted&&!word&&+num>40)continue;
  const title=m[3].replace(/\s*\.{3,}.*$/,'').replace(/\s+\d+$/,'').trim();if(title.length<2)continue;
  out.push({n:(word?m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+' ':'')+num,t:title,auto:'ocr'});
 }
 return out.length>6?[]:out;
}
async function localOCR(list,auto){
 const d=S.doc;if(!d||LO.busy)return;
 if(auto){if(ls.get('m.autoOcr')==='0')return;list=[];for(let k=0;k<d.pages.length;k++){if(S.doc!==d)return;if(await needsOCR(k))list.push(k)}}
 if(!list||!list.length){if(!auto)toast('Nothing to scan here',2000);return}
 LO.busy=true;LO.stop=false;const bar=$('#scanBar'),T=$('#scanT');let done=0,heads=0,words=0;
 const show=t=>{T.textContent=t;bar.classList.remove('hidden')};
 if(!auto){$('#panel').classList.remove('hidden');closeAI();buildThumbs()}
 show(`Getting the scanner ready…`);
 if(auto)toast(`Scanned PDF. Reading ${list.length} page${list.length>1?'s':''} on your tablet so search works…`,3200);
 try{
  const w=await tessWorker();
  for(const k of list){
   while(!LO.stop&&S.doc===d&&(cur||performance.now()-lastInput<2500))await new Promise(r=>setTimeout(r,400));
   if(LO.stop||S.doc!==d)break;
   show(`Reading page ${k+1} on your tablet (${done+1}/${list.length})…`);
   const pk=d.pages[k],c=pk.s!=null&&S.pdf?await renderPdfPage(pk.s,1600,Math.round(1600*pk.r)):await pageCanvas(k,1600);
   const r=await w.recognize(c,{},{text:true,blocks:true});
   const lines=[];for(const b of r.data.blocks||[])for(const pa of b.paragraphs||[])for(const l of pa.lines||[])lines.push(l);
   const good=lines.filter(l=>l.confidence>=40&&/[A-Za-z0-9]{2}/.test(l.text));
   const p=d.pages[k];if(p.ocrBy==='ai'){done++;continue}
   const txt=good.map(l=>l.text.trim()).join('\n').slice(0,4000);
   if(txt){p.ocr=txt;p.ocrBy='local';words+=txt.split(/\s+/).length}p.ocrTry=1;
   const hs=ocrHeads(good);p.heads=(p.heads||[]).filter(h=>h.auto!=='ocr').concat(hs);heads+=hs.length;if(!p.heads.length)delete p.heads;
   done++;S.txt={};save();if(hs.length||!auto)buildThumbs();
   await new Promise(r=>setTimeout(r,60));
  }
 }catch(e){console.warn(e);if(!auto)toast(e&&e.code==='tessfile'?'Quick scan files are missing. Upload the 4 tesseract files to your app folder.':'Quick scan hit a problem. Try AI scan instead.',4000)}
 LO.busy=false;bar.classList.add('hidden');tessSleep();
 if(done&&S.doc===d){buildThumbs();toast(`Read ${done} page${done>1?'s':''}${heads?`, found ${heads} section${heads>1?'s':''}`:''}. Search works on ${done>1?'them':'it'} now.`,3400)}
}
async function runScan(list){
 const d=S.doc;if(!d||!list.length)return;scanStop=false;LO.stop=true;while(LO.busy)await new Promise(r=>setTimeout(r,200));
 $('#ai').classList.add('hidden');AI.open=false;$('#panel').classList.remove('hidden');buildThumbs();
 const bar=$('#scanBar'),T=$('#scanT');bar.classList.remove('hidden');let done=0,heads=0,fail=0;
 for(let c=0;c<list.length;c+=3){
  if(scanStop||S.doc!==d)break;
  const chunk=list.slice(c,c+3);T.textContent=`Reading page${chunk.length>1?'s':''} ${chunk.map(k=>k+1).join(', ')} (${done}/${list.length})…`;
  const shots=[];for(const k of chunk){const sh=await pageShot(k);URL.revokeObjectURL(sh.url);shots.push(sh.blob)}
  const prompt=`You will see ${chunk.length} image${chunk.length>1?'s':''}. ${chunk.map((k,x)=>`Image ${x+1} is page ${k+1}`).join('. ')} of a student's document. For each page: transcribe all readable text, printed and handwritten, in reading order (max 3000 characters), and list any section headings that START on that page, such as "1.1 Cell structure", "Chapter 2: Forces" or "Bab 3 Tenaga". Reply with only JSON in this shape: {"pages":[{"page":${chunk[0]+1},"text":"...","headings":[{"num":"1.1","title":"Cell structure"}]}]}. "num" is the heading number exactly as written, or "" if it has none. Use an empty headings list when no section starts on that page.`;
  let res=null;
  for(let tries=0;tries<2&&!res;tries++){try{res=await aiJSON(prompt,shots)}catch(e){if(e&&e.code==='http'&&e.status===429&&!tries){T.textContent='Free limit hit, waiting 30 seconds…';await new Promise(r=>setTimeout(r,30000))}else{fail++;if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'||(e.code==='http'&&(e.status===400||e.status===403)))){toast(aiErr(e),4000);scanStop=true}break}}}
  for(const pg of (res&&Array.isArray(res.pages)?res.pages:[])){
   const k=(+pg.page||0)-1;if(!chunk.includes(k))continue;const p=d.pages[k];
   if(typeof pg.text==='string'){p.ocr=pg.text.slice(0,4000);p.ocrBy='ai'}
   const hs=(Array.isArray(pg.headings)?pg.headings:[]).filter(h=>h&&(h.num||h.title)).slice(0,6).map(h=>({n:String(h.num||'').slice(0,16),t:String(h.title||'').slice(0,80),auto:'ai'}));
   p.heads=(p.heads||[]).filter(h=>h.auto!=='ai').concat(hs);heads+=hs.length;if(!p.heads.length)delete p.heads;
  }

  if(!aiSample&&c+3<list.length&&!scanStop)await new Promise(r=>setTimeout(r,4500));

 bar.classList.add('hidden');S.txt={};

function md(t){

 let html='',list=null;const end=()=>{if(list){html+=`</${list}>`;list=null}};
 for(const ln of esc(t).split('\n')){let m;
  if(m=ln.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){end();html+='<ul>';list='ul'}html+=`<li>${inl(m[1])}</li>`}
  else if(m=ln.match(/^\s*(\d+)[.)]\s+(.*)/)){if(list!=='ol'){end();html+='<ol>';list='ol'}html+=`<li>${inl(m[2])}</li>`}
  else if(m=ln.match(/^#{1,4}\s+(.*)/)){end();html+=`<p><b>${inl(m[1])}</b></p>`}
  else if(!ln.trim())end();
  else{end();html+=`<p>${inl(ln)}</p>`}}
 end();return html;
}

function aiErr(e){
 const c=e&&(e.code||e.name),P=e&&e.prov&&typeof e.prov==='object'?e.prov:null,name=P?P.name:'The AI';
 if(c==='cancelled'||c==='AbortError')return'Stopped.';
 if(c==='nokey')return'Add a free Gemini or Groq key in Study buddy settings first.';
 if(c==='not_granted'||c==='sampling_disabled')return'Claude access was not allowed for this page.';
 if(c==='rate_limited')return'Too many requests right now. Try again in a bit.';
 if(c==='http'){
  if(e.status===400&&/model|image|vision/i.test(e.message||''))return`${name}'s model "${P?P.model:''}" can't do this. Pick another model in Study buddy settings.`;
  if(e.status===400||e.status===401||e.status===403)return`${name} rejected the key. Check it in Study buddy settings.`;
  if(e.status===404)return`${name}'s model "${P?P.model:''}" isn't available. Tap Test keys in Study buddy settings to pick one.`;
  if(e.status===429){const t=new Date(nextPacificMidnight()).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return qKey()&&gKey()?`Gemini, Gemma and Groq are all out of free answers for now. Try again in a minute, or after ${t} for the daily limit.`:`${name} is out of free answers for now. Try again later (daily limits reset around ${t}).`+(qKey()?'':' Add a Groq key as a backup in Study buddy settings.')}
  return`${name} had a problem (${e.status}). Try again.`;
 }
 if(c==='refused')return'The AI declined to answer that one.';
 if(c==='empty')return`${name} gave an empty answer. Try again.`;
 if(e instanceof TypeError)return'No internet connection.';
 return'Something went wrong. Try again.';
}

function paintSync(){
 const p=$('#syncPill');if(!p)return;
 const st=SY.dir?SY.state:'off';p.className='pill'+(st==='ok'?' ok':st==='need'||st==='err'?' warn':'');
 p.innerHTML=st==='off'?'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Auto-save off'
  :st==='busy'?'<span class="spin"></span>Saving to folder…'
  :st==='need'?'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>Tap to reconnect folder'
  :st==='err'?'Auto-save problem, tap'
  :`<span class="dot"></span>Saved to ${esc(SY.dir.name)}`;
}
async function removePath(path){try{const parts=path.split('/');let dir=SY.dir;if(parts.length>1)dir=await SY.dir.getDirectoryHandle(parts[0]);await dir.removeEntry(parts[parts.length-1])}catch(e){}}
async function writeFile(dir,name,blob){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close()}
async function syncDoc(d,taken){
 const sub=d.folder?safeName(d.folder):'',base=safeName(d.name);let path=(sub?sub+'/':'')+base+'.pdf',n=2;
 while(taken.has(path.toLowerCase()))path=(sub?sub+'/':'')+base+` (${n++}).pdf`;
 taken.add(path.toLowerCase());
 const bytes=await buildPdfBytes(d);
 const dir=sub?await SY.dir.getDirectoryHandle(sub,{create:true}):SY.dir;
 await writeFile(dir,path.split('/').pop(),new Blob([bytes],{type:'application/pdf'}));
 if(d.filePath&&d.filePath.toLowerCase()!==path.toLowerCase())await removePath(d.filePath);
 const live=S.doc&&S.doc.id===d.id?S.doc:d;live.filePath=path;live.dirty=false;live.synced=Date.now();
 if(live!==d){d.filePath=path;d.dirty=false}
 await store.put(live);
}
async function syncAll(force){
 if(!SY.dir)return;if(syncing){syncAgain=true;return}
 if(!(await ensurePerm(false)))return;
 syncing=true;SY.state='busy';paintSync();let fails=0;
 try{
  if(S.doc&&S.doc.dirty)await flush();
  const docs=await store.meta();
  const taken=new Set(docs.filter(d=>d.filePath&&!(force||d.dirty)).map(d=>d.filePath.toLowerCase()));
  for(const m of docs){if(!(force||m.dirty||!m.filePath))continue;
   try{const live=S.doc&&S.doc.id===m.id?S.doc:await store.get(m.id);if(live)await syncDoc(live,taken)}catch(e){fails++;console.warn('auto-save',m.name,e)}}
  if(force||Date.now()-(+ls.get('m.autoBk')||0)>10*60e3){
   try{await writeFile(SY.dir,'Margins backup.json',await backupBlob(await store.all()));ls.set('m.autoBk',Date.now());ls.set('m.lastBackup',Date.now())}catch(e){fails++}}
  SY.state=fails?'err':'ok';SY.last=Date.now();ls.set('m.syncLast',SY.last);
 }catch(e){SY.state='err';console.warn(e)}
 syncing=false;paintSync();
 if(syncAgain){syncAgain=false;syncAll()}
}
async function pickFolder(){
 if(!('showDirectoryPicker' in window)){sheet(`<h2>Not supported here</h2><p>This browser can't save into folders. Install Margins from Chrome on your tablet and try again there. Until then, use Save as PDF and Back up all.</p><div class="acts"><button data-v="x" class="go">OK</button></div>`);return}
 try{
  const h=await window.showDirectoryPicker({id:'margins',mode:'readwrite',startIn:'documents'});
  SY.dir=h;await store.putBlob('__dir',h);SY.state='ok';paintSync();toast('Auto-save is on. Saving everything to '+h.name+'…',3000);syncAll(true);
 }catch(e){if(e&&e.name==='AbortError')return;toast('Could not use that folder here. Try it in the installed app.',3800)}
}
async function syncSheet(){
 const on=!!SY.dir;
 const v=await sheet(on?`<h2>Auto-save folder</h2><p>Every PDF and notebook is kept in <b style="color:var(--ink)">${esc(SY.dir.name)}</b> as a PDF with your notes on it, plus one <i>Margins backup.json</i>. The same files update each time you leave a notebook. No copies pile up.</p>
  <p>${SY.state==='need'?'Android needs you to allow the folder again.':SY.last?'Last saved '+ago(SY.last)+'.':''}</p>
  <div class="list"><button data-v="now">${ic('<path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16m0 5v-5h5"/>')}${SY.state==='need'?'Reconnect and save now':'Save everything now'}</button>
  <button data-v="pick">${folderSvg}Change folder</button><div class="sep"></div><button data-v="off" class="bad">${ic('<path d="M6 6l12 12M18 6L6 18"/>')}Turn off auto-save</button></div>`
  :`<h2>Auto-save to a folder</h2><p>Pick a folder once (tip: make one called <b style="color:var(--ink)">Margins</b> in Documents). Margins then keeps every PDF and notebook there, with your writing on it, and updates the same files every time you leave a notebook.</p><p>App folders become subfolders, and a backup file is kept there too, so restoring is one tap if you ever need it.</p><div class="acts"><button data-v="x">Not now</button><button data-v="pick" class="go">Choose folder</button></div>`);
 if(v==='pick')pickFolder();
 else if(v==='now'){if(await ensurePerm(true)){syncAll(true)}else toast('Folder access was not allowed')}
 else if(v==='off'){SY.dir=null;SY.state='off';await store.delBlob('__dir');paintSync();showLib();toast('Auto-save turned off. Files already in the folder stay there.',3200)}
}
$('#syncPill').onclick=async()=>{if(SY.state==='need'){if(await ensurePerm(true))return syncAll();}syncSheet()};

/* PDFs shared into Margins from other apps (Android share menu) */
async function takeShared(){
 try{
  if(!('caches' in window))return;
  const c=await caches.open('margins-share'),keys=await c.keys();if(!keys.length)return;
  const files=[];
  for(const k of keys){const r=await c.match(k);if(r){const b=await r.blob();let n='Shared.pdf';try{n=decodeURIComponent(r.headers.get('x-name')||n)}catch(e){}files.push(new File([b],n,{type:b.type||'application/pdf'}))}await c.delete(k)}
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  if(files.length)importFiles(files);
 }catch(e){}
}
store.ready.then(async()=>{checkPersist(standalone);await showLib();loadDir();takeShared();setTimeout(()=>autoModels(),1500)});
}
