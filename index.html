<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Margins">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Margins</title>
<style>
/* VOICE: premium study app, quiet and precise; the page is the hero
   IDEA: a sheet of paper under a highlighter stroke
   PICTURE: library of real page thumbnails and cloth notebook covers; reader = floating glass tool pills over the page stack
   COLOUR and TYPE: cool paper grey, white surfaces, cobalt #3b5bfd accent, highlighter yellow; Figtree, vendored for offline
   LAYOUT: large title + search + segments, card grid, floating add button; reader pills top, tools move to bottom on phones */
@font-face{font-family:Figtree;font-weight:400;font-display:swap;src:url(figtree-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Figtree;font-weight:500;font-display:swap;src:url(figtree-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Figtree;font-weight:600;font-display:swap;src:url(figtree-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Figtree;font-weight:700;font-display:swap;src:url(figtree-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Figtree;font-weight:800;font-display:swap;src:url(figtree-latin-800-normal.woff2) format('woff2')}
:root{color-scheme:light dark;
--bg:light-dark(#f4f5f8,#0b0c0f);--surface:light-dark(#ffffff,#17181d);--surface2:light-dark(#eef0f4,#202128);
--ink:light-dark(#0e1016,#eef0f6);--mute:light-dark(#646b7a,#9aa1b0);--line:light-dark(rgba(14,16,22,.09),rgba(255,255,255,.08));
--acc:light-dark(#3b5bfd,#6d86ff);--accSoft:light-dark(rgba(59,91,253,.1),rgba(109,134,255,.16));--hi:#ffd60a;--ok:light-dark(#0f8a5f,#4fd39b);--bad:#d92d3a;
--desk:light-dark(#e6e8ee,#060708);--glass:light-dark(rgba(255,255,255,.8),rgba(30,31,38,.76));
--sh:0 1px 2px rgba(10,14,30,.06),0 14px 34px -14px rgba(10,14,30,.28);--r:16px;
--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}

/* ---------- library ---------- */
#lib{min-height:100%;padding-bottom:120px}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) max(4vw,16px) 6px;max-width:1280px;margin:0 auto}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.mark img{width:30px;height:30px;border-radius:8px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--mute)}
.pill.ok{color:var(--ok)}
.pill.ok .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--surface2)}
.btnA{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 15px;border-radius:999px;border:0;background:var(--acc);color:#fff;font-weight:600;font-size:14px}
.head{max-width:1280px;margin:0 auto;padding:18px max(4vw,16px) 6px}
.head h1{margin:0;font-size:clamp(34px,5vw,46px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
.head p{margin:6px 0 0;color:var(--mute);font-size:15px}
.bar{max-width:1280px;margin:0 auto;padding:16px max(4vw,16px) 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--mute)}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;color:var(--ink);height:100%}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface2);gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;height:38px;padding:0 14px;border-radius:10px;border:0;background:none;font-weight:600;font-size:14px;color:var(--mute);transition:background .2s var(--ease),color .2s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sortb{height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
.remind{max-width:1280px;margin:14px auto 0;padding:0 max(4vw,16px)}
.remind>div{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--hi) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--hi) 55%,transparent)}
.remind b{font-weight:700}.remind span{flex:1 1 220px;font-size:15px}
.remind button{min-height:40px;padding:0 15px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px}
.grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:28px 20px;padding:22px max(4vw,16px)}
.card{position:relative;animation:rise .35s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card .open{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.thumb{position:relative;aspect-ratio:3/4;border-radius:12px;background:#fff;box-shadow:var(--sh);overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s}
.card .open:active .thumb{transform:scale(.97)}
@media(hover:hover){.card .open:hover .thumb{transform:translateY(-3px);box-shadow:0 2px 4px rgba(10,14,30,.08),0 22px 40px -16px rgba(10,14,30,.35)}}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cover{position:absolute;inset:0;padding:16px 14px 14px 24px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
 background:linear-gradient(150deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 70%,#000))}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.08) 70%,rgba(255,255,255,.12))}
.cover::after{content:"";position:absolute;right:16px;top:0;bottom:0;width:9px;background:rgba(0,0,0,.22);box-shadow:inset 1px 0 rgba(255,255,255,.15)}
.cover b{position:relative;font-size:16px;line-height:1.2;font-weight:700;letter-spacing:-.01em;padding-right:22px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cover small{position:relative;font-size:12px;opacity:.8;font-weight:600}
.kind{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(14,16,22,.72);color:#fff;letter-spacing:.02em}
.star{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#e5a400;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.star svg{width:15px;height:15px;fill:currentColor;stroke:none}
.meta{display:flex;align-items:flex-start;gap:4px;margin-top:11px}
.meta div{flex:1}
.meta b{display:block;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta span{font-size:13px;color:var(--mute)}
.meta .ib{margin:-8px -10px 0 0;color:var(--mute)}
.empty{grid-column:1/-1;display:grid;justify-items:center;text-align:center;padding:48px 16px;gap:6px}
.empty .art{width:200px;height:150px;margin-bottom:12px}
.empty strong{font-size:22px;letter-spacing:-.02em}
.empty p{margin:0 0 16px;color:var(--mute);max-width:40ch}
.empty .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btnG{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btnP{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--acc);color:#fff;font-weight:600;box-shadow:0 10px 24px -10px var(--acc)}
.fab{position:fixed;right:max(4vw,18px);bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:20px;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px var(--acc),0 2px 6px rgba(0,0,0,.15);transition:transform .2s var(--ease);z-index:5}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px;stroke-width:2.2}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;background:var(--desk)}
#scroller{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
#pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:calc(84px + env(safe-area-inset-top)) 16px 160px;width:max-content;min-width:100%;touch-action:none;will-change:transform}
.page{position:relative;background:#fff;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.1),0 16px 40px -22px rgba(0,0,0,.55);flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:3px}
.page canvas.ink{mix-blend-mode:multiply}
.page textarea{position:absolute;z-index:3;min-width:140px;min-height:1.6em;border:1.5px solid var(--acc);border-radius:6px;background:rgba(255,255,255,.94);padding:2px 5px;margin:-4px 0 0 -7px;font-family:Figtree,sans-serif;line-height:1.25;resize:both;outline:none;color:#111;box-shadow:0 6px 18px -8px rgba(59,91,253,.6)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--sh);border-radius:18px}
.hud{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:flex-start;gap:10px;padding:0 12px;pointer-events:none;z-index:4}
.hud>*{pointer-events:auto}
.hud .sp{flex:1;pointer-events:none}
.pl{display:flex;align-items:center;gap:2px;padding:4px;height:52px}
.pl .ib{width:44px;height:44px}
.ttl{display:flex;flex-direction:column;justify-content:center;padding:0 10px 0 2px;line-height:1.2;max-width:26ch}
.ttl b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.toolsWrap{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;max-width:calc(100% - 24px)}
.tools{display:flex;align-items:center;gap:2px;padding:4px;height:52px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;width:44px;height:44px;border-radius:13px;border:0;background:none;display:grid;place-items:center;color:var(--ink);transition:background .2s var(--ease),color .2s,transform .15s}
.tools button:active{transform:scale(.9)}
.tools button[aria-pressed=true]{background:var(--acc);color:#fff;box-shadow:0 6px 14px -6px var(--acc)}
.tools button:disabled{opacity:.28}
.vr{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.ctx{display:flex;align-items:center;gap:4px;padding:6px 8px;height:48px;overflow-x:auto;scrollbar-width:none;max-width:100%;animation:drop .22s var(--ease)}
.ctx::-webkit-scrollbar{display:none}
@keyframes drop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:0;padding:0;margin:0 2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s var(--ease)}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--glass),0 0 0 4px var(--ink);transform:scale(.86)}
.swc{position:relative;flex:none;width:30px;height:30px;border-radius:50%;margin:0 2px;overflow:hidden;background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
.swc input{position:absolute;inset:-8px;width:46px;height:46px;opacity:0;cursor:pointer}
.sz{flex:none;width:36px;height:36px;border-radius:10px;border:0;background:none;display:grid;place-items:center}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed=true]{background:var(--accSoft)}
.sz[aria-pressed=true] i{background:var(--acc)}
.kd{flex:none;width:40px;height:40px;border-radius:11px;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.kd[aria-pressed=true]{background:var(--accSoft);color:var(--acc)}
.chip{flex:none;height:36px;padding:0 12px;border-radius:10px;border:0;background:none;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accSoft);color:var(--acc)}
#ring{position:fixed;left:0;top:0;border-radius:50%;border:1.5px solid rgba(20,22,30,.55);background:rgba(255,255,255,.35);box-shadow:0 0 0 1px rgba(255,255,255,.6);pointer-events:none;z-index:7;transform:translate(-50%,-50%);display:none}
.zoomBadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:14px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;z-index:6;pointer-events:none;transition:opacity .2s}
.panel{position:absolute;right:12px;top:calc(72px + env(safe-area-inset-top));bottom:12px;width:min(260px,calc(100% - 24px));display:flex;flex-direction:column;z-index:6;animation:slide .25s var(--ease)}
@keyframes slide{from{opacity:0;transform:translateX(16px)}}
.panel header{display:flex;align-items:center;gap:6px;padding:10px 6px 6px 16px}
.panel header b{flex:1;font-size:16px}
.thumbs{flex:1;overflow:auto;padding:6px 14px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;align-content:start}
.th{border:0;background:none;padding:0;display:grid;gap:5px;justify-items:center;font-size:12px;color:var(--mute);font-weight:600}
.th canvas{width:100%;background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.18);outline:2.5px solid transparent;outline-offset:2px;transition:outline-color .2s}
.th[aria-current=true] canvas{outline-color:var(--acc)}
.th[aria-current=true]{color:var(--acc)}
@media(max-width:760px){
 .toolsWrap{top:auto;bottom:calc(12px + env(safe-area-inset-bottom));flex-direction:column-reverse}
 .ttl{display:none}
 #pages{padding-top:calc(76px + env(safe-area-inset-top));padding-bottom:200px}
 .panel{top:calc(70px + env(safe-area-inset-top));bottom:calc(84px + env(safe-area-inset-bottom))}
}

.pill.warn{color:#b7791f;border-color:color-mix(in srgb,#e8a33d 50%,transparent);background:color-mix(in srgb,#e8a33d 12%,var(--surface))}
.pill .spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.mark span{display:none}.pill.ok#stPill{display:none}.top{gap:6px}}
/* selection, lasso, laser, recorder */
.sel{position:absolute;z-index:4;border:1.5px dashed var(--acc);border-radius:4px;background:rgba(59,91,253,.05);cursor:move;touch-action:none}
.sel .h{position:absolute;right:-14px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:nwse-resize}
.selbar{position:absolute;z-index:5;display:flex;align-items:center;gap:2px;padding:4px;height:50px;transform:translateX(-50%);white-space:nowrap;max-width:min(600px,calc(100vw - 24px));overflow-x:auto;scrollbar-width:none;animation:drop .2s var(--ease)}
.selbar::-webkit-scrollbar{display:none}
.selbar button{flex:none;height:40px;min-width:40px;padding:0 10px;border:0;border-radius:10px;background:none;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.selbar button svg{width:17px;height:17px}
.selbar .sw{width:24px;height:24px;min-width:0;padding:0;margin:0 3px}
.selbar .aiB{background:linear-gradient(135deg,#3b5bfd,#8b5cf6);color:#fff}
svg.lasso{position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:visible}
#laser{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.rec{display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;height:52px;font-weight:700;font-variant-numeric:tabular-nums}
.rec .dot{width:10px;height:10px;border-radius:50%;background:#e5383b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec button{height:40px;padding:0 14px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600}
.folders{max-width:1280px;margin:0 auto;padding:12px max(4vw,16px) 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.folders button{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--mute);display:inline-flex;align-items:center;gap:7px}
.folders button small{font-weight:500;opacity:.7}
.folders button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.th{position:relative}
.th .bm{position:absolute;top:-3px;right:10px;width:14px;height:20px;background:#e5383b;clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%)}
.ptabs{display:flex;gap:4px;padding:0 14px 8px}
.ptabs button{height:32px;padding:0 12px;border-radius:9px;border:0;background:none;font-weight:600;font-size:13px;color:var(--mute)}
.ptabs button[aria-pressed=true]{background:var(--accSoft);color:var(--acc)}
.phint{font-size:12px;color:var(--mute);padding:0 16px 12px;margin:0}
.res{display:grid;gap:2px;margin:10px -8px 0;max-height:50vh;overflow:auto}
.res button{display:block;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.45}
.res button:active{background:var(--surface2)}
.res b{display:block;font-size:12px;color:var(--acc);margin-bottom:2px}
.res mark{background:color-mix(in srgb,var(--hi) 65%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.audioRow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.audioRow>div{flex:1}
.audioRow b{display:block;font-size:15px}
.audioRow audio{width:100%;height:38px;margin-top:6px}
/* study buddy */
.ai{position:absolute;right:12px;top:calc(72px + env(safe-area-inset-top));bottom:12px;width:min(410px,calc(100% - 24px));display:flex;flex-direction:column;z-index:7;animation:slide .25s var(--ease);overflow:hidden}
.ai header{display:flex;align-items:center;gap:2px;padding:10px 6px 8px 16px;flex:none}
.ai header b{flex:1;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.spark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#3b5bfd,#8b5cf6);color:#fff;flex:none}
.spark svg{width:17px;height:17px}
#aiBody{display:flex;flex-direction:column;flex:1;min-height:0}
.aictx{display:flex;align-items:center;gap:10px;margin:0 14px 10px;padding:8px;border-radius:14px;background:var(--surface2);font-size:13px;color:var(--mute);flex:none}
.aictx img{width:46px;height:46px;object-fit:cover;object-position:top;border-radius:8px;background:#fff;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.aictx b{color:var(--ink);display:block;font-size:14px}
.aictx button{margin-left:auto;flex:none;height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600}

.msg.a ul,.msg.a ol{margin:4px 0 8px;padding-left:20px}

.think{display:inline-flex;gap:4px;padding:4px 0}.think i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}

/* ---------- sheets + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,10,18,.42);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}

@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
@media(max-width:600px){.scrim{place-items:end stretch;padding:0}.sheet{width:100%;border-radius:22px 22px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:up .3s var(--ease)}@keyframes up{from{transform:translateY(100%)}}}
.sheet h2{margin:0 0 4px;font-size:22px;line-height:1.2;letter-spacing:-.02em}
.sheet p{margin:0 0 14px;color:var(--mute);font-size:15px}

.covers{display:flex;gap:10px;flex-wrap:wrap}

.covers button[aria-pressed=true]{outline:2.5px solid var(--acc);outline-offset:3px}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:22px}

.tog{margin-left:auto;width:46px;height:28px;border-radius:999px;background:var(--surface2);position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#121420;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:0 14px 34px -10px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s var(--ease)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const r4=v=>Math.round(v*1e4)/1e4;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}};
const pdfjs=window.pdfjsLib;
if(pdfjs)pdfjs.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const COVERS=['#3b5bfd','#1d2433','#e4572e','#0f9d7a','#8b5cf6','#e8a33d'];
const PAPERS=[['lined','Lined'],['grid','Grid'],['dots','Dots'],['cornell','Cornell'],['blank','Blank']];
const folderSvg='<svg class="i" viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

/* ---------- toast + sheets ---------- */
let toastT;
function toast(msg,ms=2400){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}
function sheet(html,wire){
 return new Promise(res=>{
  const m=$('#modal');m.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  let done=false;const close=v=>{if(done)return;done=true;m.innerHTML='';res(v)};
  m.querySelector('.scrim').addEventListener('click',e=>{if(e.target.classList.contains('scrim'))close(null)});
  m.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>close(b.dataset.v)));
  m.querySelector('form')?.addEventListener('submit',e=>{e.preventDefault();close('ok')});
  wire&&wire(m,close);
  const inp=m.querySelector('input[type=text]');if(inp)setTimeout(()=>{inp.focus();inp.select()},60);
 });
}
const pick=(m,sel,attr,cb)=>{m.querySelectorAll(sel).forEach(b=>b.addEventListener('click',()=>{m.querySelectorAll(sel).forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.getAttribute(attr))}))};

/* ---------- storage on this device (IndexedDB) ---------- */
const store=(()=>{
 let db=null;const mem={docs:new Map(),pdfs:new Map(),blobs:new Map()};
 const ready=new Promise(res=>{
  try{const r=indexedDB.open('margins',2);
   r.onupgradeneeded=()=>{const d=r.result;for(const n of['docs','pdfs','blobs'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};
   r.onsuccess=()=>{db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false);
  }catch(e){res(false)}
 });
 const tx=(s,mode,f)=>new Promise((res,rej)=>{const t=db.transaction(s,mode);const q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
 return{ready,get ok(){return !!db},
  all:()=>db?tx('docs','readonly',s=>s.getAll()):Promise.resolve([...mem.docs.values()]),
  get:id=>db?tx('docs','readonly',s=>s.get(id)):Promise.resolve(mem.docs.get(id)),
  put:d=>db?tx('docs','readwrite',s=>s.put(d)):(mem.docs.set(d.id,d),Promise.resolve()),
  async del(id){if(!db){mem.docs.delete(id);mem.pdfs.delete(id);return}await tx('docs','readwrite',s=>s.delete(id));await tx('pdfs','readwrite',s=>s.delete(id))},
  putPdf:(id,bytes)=>db?tx('pdfs','readwrite',s=>s.put({id,bytes})):(mem.pdfs.set(id,bytes),Promise.resolve()),
  async getPdf(id){if(!db)return mem.pdfs.get(id)||null;const r=await tx('pdfs','readonly',s=>s.get(id));return r?r.bytes:null},
  putBlob:(id,data)=>db?tx('blobs','readwrite',s=>s.put({id,data})):(mem.blobs.set(id,data),Promise.resolve()),
  async getBlob(id){if(!db)return mem.blobs.get(id)||null;const r=await tx('blobs','readonly',s=>s.get(id));return r?r.data:null},
  delBlob:id=>db?tx('blobs','readwrite',s=>s.delete(id)):(mem.blobs.delete(id),Promise.resolve())
 };
})();
let persisted=null;
async function checkPersist(ask){
 try{if(!navigator.storage||!navigator.storage.persisted){persisted=null;return}
  persisted=await navigator.storage.persisted();
  if(!persisted&&ask)persisted=await navigator.storage.persist();
 }catch(e){persisted=null}
 paintPill();
}
function paintPill(){
 const p=$('#stPill');
 if(!store.ok){p.className='pill';p.style.color='var(--bad)';p.textContent='Storage blocked';return}
 p.style.color='';
 if(persisted){p.className='pill ok';p.innerHTML='<span class="dot"></span>Protected'}
 else{p.className='pill';p.innerHTML='<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/></svg>Protect storage'}
}
$('#stPill').onclick=async()=>{
 await checkPersist(true);

const A4=1.4142;
function drawPaper(ctx,w,h,bg){
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
 if(bg==='lined'){ctx.strokeStyle='#cbd7ec';ctx.lineWidth=Math.max(1,w/900);const g=w*.038;for(let y=w*.14;y<h-g*.5;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  ctx.strokeStyle='#f2b8b8';ctx.beginPath();ctx.moveTo(w*.1,0);ctx.lineTo(w*.1,h);ctx.stroke()}
 else if(bg==='grid'){ctx.strokeStyle='#e0e5ee';ctx.lineWidth=Math.max(1,w/1000);const g=w*.035;for(let x=g;x<w;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=g;y<h;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
 else if(bg==='dots'){ctx.fillStyle='#c4cad6';const g=w*.035,r=Math.max(1,w/600);for(let x=g;x<w;x+=g)for(let y=g;y<h;y+=g){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}}
 else if(bg==='cornell'){ctx.strokeStyle='#d5deee';ctx.lineWidth=Math.max(1,w/900);const g=w*.038,sy=h*.8;for(let y=w*.14;y<sy-g*.3;y+=g){ctx.beginPath();ctx.moveTo(w*.3,y);ctx.lineTo(w,y);ctx.stroke()}
  ctx.strokeStyle='#9fb0cf';ctx.lineWidth=Math.max(1.5,w/500);ctx.beginPath();ctx.moveTo(0,w*.1);ctx.lineTo(w,w*.1);ctx.moveTo(w*.3,w*.1);ctx.lineTo(w*.3,sy);ctx.moveTo(0,sy);ctx.lineTo(w,sy);ctx.stroke()}
}

/* images */
function prepImage(file,max=1600){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const png=/png|gif|webp/.test(file.type)&&file.size<1.5e6;
  if(!png){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
  const src=c.toDataURL(png?'image/png':'image/jpeg',.86);const el=new Image();el.src=src;res({src,el,w,h})};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad image'))};im.src=u})}
const imgCache=new Map(),imgWait=new Map();
function ensureImg(ref){
 const c=imgCache.get(ref);if(c)return Promise.resolve(c);if(imgWait.has(ref))return imgWait.get(ref);
 const p=store.getBlob(ref).then(src=>new Promise(res=>{if(!src)return res(null);const el=new Image();el.onload=()=>{const v={el};imgCache.set(ref,v);imgWait.delete(ref);res(v)};el.onerror=()=>{imgWait.delete(ref);res(null)};el.src=src}));
 imgWait.set(ref,p);return p;
}
function needImg(ref){if(imgWait.has(ref))return;ensureImg(ref).then(v=>{if(v&&S.doc)S.doc.pages.forEach((p,i)=>{if(vis.has(i)&&p.a.some(it=>it.ref===ref))redraw(i)})})}

  const r=im.h/im.w;let iw=.92,ih=iw*r;if(ih>A4-.08){ih=A4-.08;iw=ih/r}
  pages.push({s:null,r:A4,bg:'blank',a:[{t:'img',ref,x:r4((1-iw)/2),y:r4((A4-ih)/2),w:r4(iw),h:r4(ih)}]})}catch(err){}}

async function importFiles(files){
 if(!files.length)return;
 if(!pdfjs)return toast('PDF engine failed to load. Reload the app.');
 let last=null,ok=0;
 for(const f of files){
  try{toast('Opening '+f.name+'…',60000);last=await importPdf(f);ok++}
  catch(err){toast('Could not open '+f.name+(err&&err.name==='PasswordException'?' (password protected)':''),3500)}
 }
 checkPersist(true);
 $('#toast').classList.remove('show');
 if(ok===1&&files.length===1)openDoc(last);else{if(ok)toast(`Added ${ok} ${ok===1?'file':'files'}`);showLib()}
}
if('launchQueue' in window){try{launchQueue.setConsumer(async p=>{const fs=[];for(const h of p.files||[]){try{fs.push(await h.getFile())}catch(e){}}importFiles(fs)})}catch(e){}}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();const fs=[...(e.dataTransfer?.files||[])].filter(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));if(fs.length)importFiles(fs)});
async function importPdf(file){
 const buf=await file.arrayBuffer();
 const pdf=await pdfjs.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
 const pages=[];
 for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const v=p.getViewport({scale:1});pages.push({s:i-1,r:r4(v.height/v.width),bg:'blank',a:[]})}
 let thumb=null;
 try{const p=await pdf.getPage(1);const v0=p.getViewport({scale:1});const v=p.getViewport({scale:300/v0.width});const c=document.createElement('canvas');c.width=v.width;c.height=v.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await p.render({canvasContext:x,viewport:v}).promise;thumb=c.toDataURL('image/jpeg',.75)}catch(e){}
 const doc={id:uid(),name:file.name.replace(/\.pdf$/i,''),created:Date.now(),updated:Date.now(),hasPdf:true,paper:'lined',star:false,pages,thumb};
 await store.putPdf(doc.id,buf);await store.put(doc);pdf.destroy();
 return doc.id;
}

/* backup / restore */
function toB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function fromB64(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
async function backupBlob(docs){
 const out=[],blobs={};for(const d of docs){const b=d.hasPdf?await store.getPdf(d.id):null;out.push(Object.assign({},d,{pdf:b?toB64(b):null}));for(const r of docRefs(d))if(!(r in blobs)){const v=await store.getBlob(r);if(v)blobs[r]=v}}
 return new Blob([JSON.stringify({app:'margins',v:2,at:Date.now(),docs:out.map(d=>{const c=Object.assign({},d);delete c.filePath;delete c.synced;return c}),blobs})],{type:'application/json'});
}
async function backup(){
 const docs=await store.all();if(!docs.length)return toast('Nothing to back up yet');
 toast('Packing backup…',60000);
 const blob=await backupBlob(docs);
 if(await saveFile(`margins-backup-${new Date().toISOString().slice(0,10)}.json`,blob)){ls.set('m.lastBackup',Date.now());showLib()}
}
$('#fRestore').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{toast('Restoring…',60000);const data=JSON.parse(await f.text());
  if(!data||data.app!=='margins'||!Array.isArray(data.docs))throw 0;
  if(data.blobs)for(const[k,v]of Object.entries(data.blobs))await store.putBlob(k,v);
  let n=0;for(const d of data.docs){d.dirty=true;if(d.pdf)await store.putPdf(d.id,fromB64(d.pdf));delete d.pdf;await store.put(d);n++}
  toast(`Restored ${n} ${n===1?'file':'files'}`);showLib();
 }catch(err){toast('That file is not a Margins backup')}
};

function buildPages(){

async function renderPage(i){

 let cw=Math.round(S.W*dpr),ch=Math.round(S.W*p.r*dpr);

async function renderPdfPage(s,cw,ch){

 const off=document.createElement('canvas');off.width=cw;off.height=ch;const oc=off.getContext('2d');oc.fillStyle='#fff';oc.fillRect(0,0,cw,ch);

const kindOf=it=>it.t==='pencil'?'pencil':it.t==='pen'?(it.k||'ball'):it.t;
const isBlob=k=>k==='fountain'||k==='brush'||k==='pencil';
function widths(it){
 const n=it.p.length/2,k=kindOf(it),out=new Array(n);
 for(let j=0;j<n;j++){
  const q=it.q&&it.q[j]!=null?it.q[j]:.5;
  let f=k==='fountain'?.42+.9*q:k==='brush'?.12+1.55*q*q:k==='pencil'?.72+.5*q:1;
  if(!it.s&&(k==='fountain'||k==='brush')&&n>3){const tp=Math.min(j,n-1-j);if(tp<5)f*=.45+.55*tp/5}
  out[j]=it.w*f;
 }
 return out;
}
/* variable-width ink: a union of discs and the quads between them, filled once */
function blob(sink,p,ws,s){
 const n=p.length/2;
 for(let j=0;j<n;j++){
  const x=p[2*j]*s,y=p[2*j+1]*s,r=Math.max(.3,ws[j]*s/2);sink.c(x,y,r);
  if(j<n-1){
   const x2=p[2*j+2]*s,y2=p[2*j+3]*s,rb=Math.max(.3,ws[j+1]*s/2),dx=x2-x,dy=y2-y,L=Math.hypot(dx,dy);
   if(L<1e-6||L<Math.abs(r-rb))continue;
   const nx=-dy/L,ny=dx/L;let pts=[[x+nx*r,y+ny*r],[x2+nx*rb,y2+ny*rb],[x2-nx*rb,y2-ny*rb],[x-nx*r,y-ny*r]];
   let ar=0;for(let k=0;k<4;k++){const A=pts[k],B=pts[(k+1)%4];ar+=A[0]*B[1]-B[0]*A[1]}
   if(ar<0)pts.reverse();sink.q(pts);
  }
 }
}
const canvasSink=ctx=>({c(x,y,r){ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,Math.PI*2)},q(pts){ctx.moveTo(pts[0][0],pts[0][1]);for(let k=1;k<4;k++)ctx.lineTo(pts[k][0],pts[k][1]);ctx.closePath()}});
const patCache=new WeakMap();
function pencilPat(ctx,color){
 let m=patCache.get(ctx);if(!m){m=new Map();patCache.set(ctx,m)}
 let pat=m.get(color);if(pat)return pat;
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
 x.fillStyle=color;x.globalAlpha=.42;x.fillRect(0,0,64,64);
 for(let k=0;k<1100;k++){x.globalAlpha=.3+rnd()*.7;const z=rnd()<.75?1:2;x.fillRect(rnd()*64|0,rnd()*64|0,z,z)}
 for(let k=0;k<420;k++)x.clearRect(rnd()*64|0,rnd()*64|0,1,1);

}
function drawItems(ctx,items,s){
 ctx.lineCap='round';ctx.lineJoin='round';
 for(const it of items){
  if(it.t==='text'){
   const fs=it.z*s;ctx.globalAlpha=1;ctx.fillStyle=it.c;ctx.font=`500 ${fs}px Figtree,sans-serif`;ctx.textBaseline='top';
   const lines=it.v.split('\n');let mw=0;lines.forEach((ln,k)=>{ctx.fillText(ln,it.x*s,it.y*s+k*fs*1.25);mw=Math.max(mw,ctx.measureText(ln).width)});
   bbox.set(it,{x:it.x,y:it.y,w:mw/s,h:lines.length*it.z*1.25});continue;
  }
  if(it.t==='img'){const c=imgCache.get(it.ref);if(c&&c.el.complete&&c.el.naturalWidth){ctx.globalAlpha=1;ctx.drawImage(c.el,it.x*s,it.y*s,it.w*s,it.h*s)}else needImg(it.ref);continue}
  const k=kindOf(it),p=it.p;
  if(isBlob(k)){
   ctx.globalAlpha=k==='pencil'?.9:1;ctx.fillStyle=k==='pencil'?pencilPat(ctx,it.c):it.c;
   ctx.beginPath();blob(canvasSink(ctx),p,widths(it),s);ctx.fill('nonzero');continue;
  }
  ctx.strokeStyle=it.c;ctx.lineWidth=it.w*s;ctx.globalAlpha=it.t==='hl'?.42:1;
  ctx.beginPath();ctx.moveTo(p[0]*s,p[1]*s);
  if(p.length<=2)ctx.lineTo(p[0]*s+.1,p[1]*s);
  else if(it.s){for(let j=2;j<p.length;j+=2)ctx.lineTo(p[j]*s,p[j+1]*s)}
  else{for(let j=2;j<p.length-2;j+=2){const mx=(p[j]+p[j+2])/2,my=(p[j+1]+p[j+3])/2;ctx.quadraticCurveTo(p[j]*s,p[j+1]*s,mx*s,my*s)}ctx.lineTo(p[p.length-2]*s,p[p.length-1]*s)}

 }

}
function drawInk(i){

function pos(e,el){const r=el.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.width}}
function segDist(pt,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((pt.x-x1)*dx+(pt.y-y1)*dy)/l:0;t=clamp(t,0,1);const x=x1+t*dx-pt.x,y=y1+t*dy-pt.y;return Math.sqrt(x*x+y*y)}
function hits(it,pt,rad){
 if(it.t==='img')return pt.x>=it.x-rad&&pt.x<=it.x+it.w+rad&&pt.y>=it.y-rad&&pt.y<=it.y+it.h+rad;
 if(it.t==='text'){const b=bbox.get(it);return !!b&&pt.x>=b.x-rad&&pt.x<=b.x+b.w+rad&&pt.y>=b.y-rad&&pt.y<=b.y+b.h+rad}
 const p=it.p,r=rad+(isBlob(kindOf(it))?it.w*.8:it.w/2);
 if(p.length<=2){const dx=p[0]-pt.x,dy=p[1]-pt.y;return dx*dx+dy*dy<=r*r}
 for(let k=0;k<p.length-2;k+=2)if(segDist(pt,p[k],p[k+1],p[k+2],p[k+3])<=r)return true;
 return false;
}

/* gestures: draw, pan with momentum, pinch zoom */
const touches=new Map();let cur=null,pan=null,pinch=null,inert=0;
function stopInertia(){cancelAnimationFrame(inert);inert=0}
function startInertia(vx,vy){
 stopInertia();let last=performance.now();
 const step=t=>{const dt=Math.min(32,t-last);last=t;scroller.scrollBy(-vx*dt,-vy*dt);const k=Math.pow(.94,dt/16);vx*=k;vy*=k;if(Math.abs(vx)+Math.abs(vy)>.02)inert=requestAnimationFrame(step);else inert=0};
 if(Math.abs(vx)+Math.abs(vy)>.1)inert=requestAnimationFrame(step);
}
function abortTouchStroke(){
 if(cur&&cur.type==='touch'){clearTimeout(cur.holdT);cur.base=null;const h=S.hist.pop();if(h){S.doc.pages[h.i].a=h.a;redraw(h.i)}syncUndo();cur=null}
}
function startPinch(){
 const[a,b]=[...touches.values()];const r=pagesEl.getBoundingClientRect();const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
 pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:S.zoom,cx,cy,f:1,t0:performance.now(),moved:false,tx:0,ty:0};

}
function updatePinch(){
 const[a,b]=[...touches.values()];const f=clamp(Math.hypot(a.x-b.x,a.y-b.y)/pinch.d0,.5/pinch.z0,4/pinch.z0);
 const tx=(a.x+b.x)/2-pinch.cx,ty=(a.y+b.y)/2-pinch.cy;
 if(Math.abs(f-1)>.03||Math.hypot(tx,ty)>10)pinch.moved=true;
 pinch.f=f;pinch.tx=tx;pinch.ty=ty;pagesEl.style.transform=`translate(${tx}px,${ty}px) scale(${f})`;if(Math.abs(f-1)>.03)badge(Math.round(pinch.z0*f*100)+'%');
}
function endPinch(){
 const p=pinch;pinch=null;pagesEl.style.transform='';pagesEl.style.transformOrigin='';
 if(!p.moved&&performance.now()-p.t0<320){if(S.hist.length){undo(S.hist,S.redo);toast('Undo',700)}return}
 const z=clamp(p.z0*p.f,.5,4);if(Math.abs(z-S.zoom)>.002)zoomAt(z,p.cx,p.cy);scroller.scrollBy(-p.tx,-p.ty);
}
function zoomAt(z,cx,cy){
 const sr=scroller.getBoundingClientRect();const px=scroller.scrollLeft+cx-sr.left,py=scroller.scrollTop+cy-sr.top;
 const k=z/S.zoom;S.zoom=z;layout();
 scroller.scrollLeft=px*k-(cx-sr.left);scroller.scrollTop=py*k-(cy-sr.top);badge(Math.round(z*100)+'%');
}
let badgeT;function badge(t){const b=$('#zoomBadge');b.textContent=t;b.style.opacity=1;clearTimeout(badgeT);badgeT=setTimeout(()=>b.style.opacity=0,700)}

pagesEl.addEventListener('pointerdown',e=>{

/* real eraser: cut the stroke where the eraser touches, keep the rest */

/* lasso selection */
function inPoly(x,y,p){let ins=false;for(let i=0,j=p.length-2;i<p.length;j=i,i+=2){const xi=p[i],yi=p[i+1],xj=p[j],yj=p[j+1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins}

 if(!s){s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','lasso');s.innerHTML='<path fill="rgba(59,91,253,.08)" stroke="#3b5bfd" stroke-width="1.6" stroke-dasharray="6 4" stroke-linejoin="round"/>';cur.el.appendChild(s)}
 const W=S.W,p=cur.pts;let d='';for(let k=0;k<p.length;k+=2)d+=(k?'L':'M')+(p[k]*W).toFixed(1)+' '+(p[k+1]*W).toFixed(1);s.firstChild.setAttribute('d',d+'Z');
}
function finishLasso(c){

 else items=page.a.filter(it=>{
  if(it.t==='text'){const b=bbox.get(it);return !!b&&inPoly(b.x+b.w/2,b.y+b.h/2,poly)}
  if(it.t==='img')return inPoly(it.x+it.w/2,it.y+it.h/2,poly);
  const p=it.p,n=p.length/2,st=Math.max(1,Math.floor(n/24));let a=0,k=0;for(let j=0;j<n;j+=st){k++;if(inPoly(p[2*j],p[2*j+1],poly))a++}return a/k>=.5;

function itemBox(it){

function laserTick(){

 const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);

const R={mr:null,chunks:[],t0:0,iv:0,doc:null};
const fmtDur=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
async function startRec(){
 if(R.mr)return;
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);
  R.mr=mr;R.chunks=[];R.t0=Date.now();R.doc=S.doc;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)R.chunks.push(e.data)};
  mr.onstop=async()=>{
   st.getTracks().forEach(t=>t.stop());clearInterval(R.iv);$('#rec').classList.add('hidden');
   const blob=new Blob(R.chunks,{type:mr.mimeType||'audio/webm'}),dur=Math.round((Date.now()-R.t0)/1000),d=R.doc;R.mr=null;R.doc=null;if(!d||!blob.size)return;
   const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
   const id=uid();await store.putBlob(id,data);d.audio=d.audio||[];d.audio.push({id,name:'Recording '+(d.audio.length+1),dur,created:Date.now()});d.updated=Date.now();await store.put(d);
   toast('Recording saved. Play it from More, then Recordings.',3200);
  };
  mr.start(1000);$('#rec').classList.remove('hidden');$('#recT').textContent='0:00';
  R.iv=setInterval(()=>{$('#recT').textContent=fmtDur(Math.round((Date.now()-R.t0)/1000))},500);buzz();
 }catch(e){toast('Microphone not available here. It works in the installed app.',3600)}
}

/* export annotated PDF */
function hexRgb(h){const n=parseInt(h.slice(1),16);return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)}
async function exportPdf(d){
 if(!window.PDFLib)return toast('PDF writer failed to load. Reload the app.');
 toast('Building PDF…',60000);
 try{const bytes=await buildPdfBytes(d);await saveFile((d.name||'notes')+' (notes).pdf',new Blob([bytes],{type:'application/pdf'}))}
 catch(e){toast('Could not build the PDF')}
}
async function buildPdfBytes(d){
 {
  const{PDFDocument,rgb,LineCapStyle,BlendMode,StandardFonts}=PDFLib;
  const out=await PDFDocument.create();let copied=[];
  if(d.hasPdf){const b=await store.getPdf(d.id);const src=await PDFDocument.load(b,{ignoreEncryption:true});copied=await out.copyPages(src,src.getPageIndices())}
  const font=await out.embedFont(StandardFonts.Helvetica);const emb=new Map();
  const baseW=copied[0]?copied[0].getSize().width:595.28;
  for(const p of d.pages){
   let pg;
   if(p.s!=null&&copied[p.s]){pg=copied[p.s];out.addPage(pg)}else{pg=out.addPage([baseW,baseW*p.r]);paperPdf(pg,p.bg,rgb)}
   const{width:W,height:H}=pg.getSize();
   for(const it of p.a){
    if(it.t==='img'){try{let im=emb.get(it.ref);if(!im){const src=await store.getBlob(it.ref);if(!src)continue;const bytes=fromB64(src.split(',')[1]);im=src.startsWith('data:image/png')?await out.embedPng(bytes):await out.embedJpg(bytes);emb.set(it.ref,im)}
     pg.drawImage(im,{x:it.x*W,y:H-(it.y+it.h)*W,width:it.w*W,height:it.h*W})}catch(e){}continue}
    if(it.t==='text'){const fs=it.z*W;it.v.split('\n').forEach((ln,k)=>{const safe=ln.replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');if(safe)pg.drawText(safe,{x:it.x*W,y:H-it.y*W-fs*(k*1.25+.9),size:fs,font,color:hexRgb(it.c)})});continue}

 const v=await sheet(on?`<h2>Auto-save folder</h2><p>Every PDF and notebook is kept in <b style="color:var(--ink)">${esc(SY.dir.name)}</b> as a PDF with your notes on it, plus one <i>Margins backup.json</i>. The same files update each time you leave a notebook. No copies pile up.</p>
  <p>${SY.state==='need'?'Android needs you to allow the folder again.':SY.last?'Last saved '+ago(SY.last)+'.':''}</p>
  <div class="list"><button data-v="now">${ic('<path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16m0 5v-5h5"/>')}${SY.state==='need'?'Reconnect and save now':'Save everything now'}</button>
  <button data-v="pick">${folderSvg}Change folder</button><div class="sep"></div><button data-v="off" class="bad">${ic('<path d="M6 6l12 12M18 6L6 18"/>')}Turn off auto-save</button></div>`
  :`<h2>Auto-save to a folder</h2><p>Pick a folder once (tip: make one called <b style="color:var(--ink)">Margins</b> in Documents). Margins then keeps every PDF and notebook there, with your writing on it, and updates the same files every time you leave a notebook.</p><p>App folders become subfolders, and a backup file is kept there too, so restoring is one tap if you ever need it.</p><div class="acts"><button data-v="x">Not now</button><button data-v="pick" class="go">Choose folder</button></div>`);
 if(v==='pick')pickFolder();
 else if(v==='now'){if(await ensurePerm(true)){syncAll(true)}else toast('Folder access was not allowed')}
 else if(v==='off'){SY.dir=null;SY.state='off';await store.delBlob('__dir');paintSync();showLib();toast('Auto-save turned off. Files already in the folder stay there.',3200)}
}
$('#syncPill').onclick=async()=>{if(SY.state==='need'){if(await ensurePerm(true))return syncAll();}syncSheet()};

store.ready.then(()=>{checkPersist(standalone);showLib();loadDir()});
}
</script>
</body>
</html>
